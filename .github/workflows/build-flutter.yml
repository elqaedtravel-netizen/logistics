name: Flutter Multi-Platform Cloud Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish-android-apk:
    name: 📱 Build & Publish Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies & Verify Dart Code
        working-directory: ./frontend
        run: |
          flutter config --no-analytics
          flutter pub get
          echo "=== VERIFYING DART CODEBASE VIA WEB BUILD ==="
          flutter build web --release

      - name: Generate Clean Android Project Config
        working-directory: ./frontend
        run: |
          rm -rf android
          flutter create . --org com.entelaqa --project-name antigravity_logistics_app --platforms=android
          # Add permissions to AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.CALL_PHONE"/>' android/app/src/main/AndroidManifest.xml
          # Set Arabic app label
          sed -i 's/android:label="antigravity_logistics_app"/android:label="شركة انطلاقه للشحن"/' android/app/src/main/AndroidManifest.xml
          # Enforce minSdk 21 in build.gradle or build.gradle.kts
          find android -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/minSdkVersion(flutter.minSdkVersion)/minSdkVersion(21)/g' {} +
          flutter pub get

      - name: Build Android Release APK
        working-directory: ./frontend
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Release Asset
        run: |
          mkdir -p release_assets
          APK_PATH=$(find frontend/build -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -type f -name "*.apk" | head -n 1)
          fi
          echo "Found built APK at: $APK_PATH"
          cp -v "$APK_PATH" release_assets/Entelaqa-Express-Driver-App.apk
          ls -lh release_assets/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Driver-App-Android-APK
          path: release_assets/Entelaqa-Express-Driver-App.apk
          retention-days: 30

      - name: Publish Android APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "🚀 شركة انطلاقه للشحن والتوصيل - التطبيقات الرسمية (v1.0.0)"
          body: |
            ## 🏢 شركة انطلاقه للشحن والتوصيل (Entelaqa Express Logistics Co. 🇪🇬)
            
            مرحباً بك في صفحة التحميل المباشرة للإصدار النهائي المعتمد:
            
            ### 📱 تطبيق الأندرويد للمناديب والعملاء (Android APK):
            * **تحميل التطبيق**: [`Entelaqa-Express-Driver-App.apk`](https://github.com/elqaedtravel-netizen/logistics/releases/download/v1.0.0/Entelaqa-Express-Driver-App.apk)
            * **الميزات**:
              * خط السير اليومي مع خرائط الملاحة 📍
              * الاتصال المباشر بالعملاء 📞
              * العهدة العينية بالصور والأسعار 📦
              * ماسح الباركود السريع للكاميرا ⚡
              * تسجيل وإثبات التسليم والتأجيلات مع الـ GPS
            
            ### 🌐 المنصة السحابية المباشرة (Web App):
            👉 [https://elqaedtravel-netizen.github.io/logistics/](https://elqaedtravel-netizen.github.io/logistics/)
          files: release_assets/Entelaqa-Express-Driver-App.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}