name: Flutter Multi-Platform Cloud Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish-android-apk:
    name: 📱 Build & Publish Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: ./frontend
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: Build Android Release APK
        working-directory: ./frontend
        run: |
          echo "=== Starting Flutter Release APK Build ==="
          set +e
          flutter build apk --release --verbose --no-tree-shake-icons > build_log.txt 2>&1
          BUILD_STATUS=$?
          echo "Build finished with exit code $BUILD_STATUS"
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "::error::Flutter build failed. Printing last 100 lines of log:"
            tail -n 100 build_log.txt
            exit $BUILD_STATUS
          fi

      - name: Prepare APK Release Asset
        run: |
          mkdir -p release_assets
          # Locate built APK and copy
          APK_PATH=$(find frontend/build/app/outputs/flutter-apk -name "*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find frontend/build/app/outputs/flutter-apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" release_assets/Entelaqa-Express-Driver-App.apk
          ls -la release_assets/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Driver-App-Android-APK
          path: release_assets/Entelaqa-Express-Driver-App.apk
          retention-days: 30

      - name: Publish Android APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "🚀 شركة انطلاقه للشحن والتوصيل - التطبيقات الرسمية (v1.0.0)"
          body: |
            ## 🏢 شركة انطلاقه للشحن والتوصيل (Entelaqa Express Logistics Co. 🇪🇬)
            
            مرحباً بك في صفحة التحميل المباشرة للإصدار النهائي المعتمد:
            
            ### 📱 تطبيق الأندرويد للمناديب والعملاء (Android APK):
            * **تحميل التطبيق**: [`Entelaqa-Express-Driver-App.apk`](https://github.com/elqaedtravel-netizen/logistics/releases/download/v1.0.0/Entelaqa-Express-Driver-App.apk)
            * **الميزات**:
              * خط السير اليومي مع خرائط الملاحة 📍
              * الاتصال المباشر بالعملاء 📞
              * العهدة العينية بالصور والأسعار 📦
              * ماسح الباركود السريع للكاميرا ⚡
              * تسجيل وإثبات التسليم والتأجيلات مع الـ GPS
            
            ### 🌐 المنصة السحابية المباشرة (Web App):
            👉 [https://elqaedtravel-netizen.github.io/logistics/](https://elqaedtravel-netizen.github.io/logistics/)
          files: release_assets/Entelaqa-Express-Driver-App.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}