name: Flutter Multi-Platform Cloud Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish-android-apk:
    name: 📱 Build & Publish Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: ./frontend
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: Build Android Release APK
        working-directory: ./frontend
        run: |
          echo "=== RUNNING FLUTTER RELEASE BUILD ==="
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee ../build_log.txt

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Build-Log
          path: build_log.txt
          retention-days: 7

      - name: Prepare APK Release Asset
        run: |
          mkdir -p release_assets
          echo "=== SEARCHING FOR BUILT APKs ==="
          find . -name "*.apk"
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp -v "$APK_PATH" release_assets/Entelaqa-Express-Driver-App.apk
          ls -lh release_assets/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Driver-App-Android-APK
          path: release_assets/Entelaqa-Express-Driver-App.apk
          retention-days: 30

      - name: Publish Android APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "🚀 شركة انطلاقه للشحن والتوصيل - التطبيقات الرسمية (v1.0.0)"
          body: |
            ## 🏢 شركة انطلاقه للشحن والتوصيل (Entelaqa Express Logistics Co. 🇪🇬)
            
            مرحباً بك في صفحة التحميل المباشرة للإصدار النهائي المعتمد:
            
            ### 📱 تطبيق الأندرويد للمناديب والعملاء (Android APK):
            * **تحميل التطبيق**: [`Entelaqa-Express-Driver-App.apk`](https://github.com/elqaedtravel-netizen/logistics/releases/download/v1.0.0/Entelaqa-Express-Driver-App.apk)
            * **الميزات**:
              * خط السير اليومي مع خرائط الملاحة 📍
              * الاتصال المباشر بالعملاء 📞
              * العهدة العينية بالصور والأسعار 📦
              * ماسح الباركود السريع للكاميرا ⚡
              * تسجيل وإثبات التسليم والتأجيلات مع الـ GPS
            
            ### 🌐 المنصة السحابية المباشرة (Web App):
            👉 [https://elqaedtravel-netizen.github.io/logistics/](https://elqaedtravel-netizen.github.io/logistics/)
          files: release_assets/Entelaqa-Express-Driver-App.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}