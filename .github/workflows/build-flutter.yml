name: Flutter Multi-Platform Cloud Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: 📱 Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Configure Android Project Platforms
        working-directory: ./frontend
        run: |
          flutter create --platforms=android --org=io.antigravity.logistics .
          # Ensure minSdkVersion is 21 for mobile_scanner
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle || true
          flutter pub get

      - name: Build Android Release APK
        working-directory: ./frontend
        run: flutter build apk --release

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Driver-App-Android-APKs
          path: frontend/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  build-windows-exe:
    name: 🖥️ Build Windows Desktop Release (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop & Configure Runner
        working-directory: ./frontend
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --org=io.antigravity.logistics .
          flutter pub get

      - name: Build Windows Desktop Release
        working-directory: ./frontend
        run: flutter build windows --release

      - name: Compress Windows Executable Package
        run: Compress-Archive -Path frontend/build/windows/x64/runner/Release/* -DestinationPath AntigravityLogistics-Windows-x64.zip

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Admin-Panel-Windows-x64-Release
          path: AntigravityLogistics-Windows-x64.zip
          retention-days: 14

  build-web:
    name: 🌐 Build Web App & Live Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Configure Web Platform
        working-directory: ./frontend
        run: |
          flutter config --enable-web
          flutter create --platforms=web --org=io.antigravity.logistics .
          flutter pub get
          flutter build web --release --base-href "/logistics/"

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Logistics-Web-App
          path: frontend/build/web
          retention-days: 14
