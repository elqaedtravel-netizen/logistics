name: antigravity_logistics_app
description: "Antigravity Cross-Platform Logistics, Shipping & E-Commerce Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  dio: ^5.4.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  uuid: ^4.3.3

  # UI & Visuals
  google_fonts: ^6.1.0
  fl_chart: ^0.66.2
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Hardware Scanner & Media (Android Mobile Camera & USB Keyboard Listener)
  mobile_scanner: ^5.0.1
  qr_flutter: ^4.1.0

  # Authentication & External Links
  google_sign_in: ^6.2.1
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
